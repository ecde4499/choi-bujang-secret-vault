<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 로그인 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 820px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    h2 { margin-top: 30px; }
    p { font-size: 16px; line-height: 1.7; color: #bfd0e5; }
    .panel, .notice { margin: 20px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .notice { border-color: #8ad8df; }
    form { display: grid; gap: 10px; }
    input, textarea, button { font: inherit; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #51667c; border-radius: 9px; background: #101a28; color: #ecf4ff; }
    textarea { min-height: 92px; resize: vertical; }
    button { padding: 10px 14px; border: 0; border-radius: 9px; cursor: pointer; background: #8ad8df; color: #10202c; font-weight: 700; }
    button.secondary { background: #51667c; color: #ecf4ff; }
    button.danger { background: #d07384; color: #fff; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row > button { width: auto; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { display: block; color: #bfd0e5; white-space: pre-wrap; margin-bottom: 12px; }
    .status { min-height: 1.5em; color: #ffd7a0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 한곳으로</div>
    <h1>로그인 자료실</h1>
    <p>로그인과 메모 자료 요청을 모두 같은 사이트의 서버 함수로 보내고, 브라우저에는 데이터 서비스 키를 두지 않습니다.</p>

    <section id="signed-out" class="panel">
      <h2>로그인</h2>
      <form id="login-form">
        <label>이메일<input id="email" type="email" autocomplete="username" required></label>
        <label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
      </form>
      <p id="login-status" class="status" aria-live="polite"></p>
    </section>

    <section id="signed-in" class="panel" hidden>
      <div class="row">
        <strong id="session-label">로그인됨</strong>
        <button id="logout" class="secondary" type="button">로그아웃</button>
      </div>
      <p>로그인 토큰은 HttpOnly 세션 쿠키로 서버 함수에 전달되며 화면 코드에서 읽지 않습니다.</p>
    </section>

    <section id="vault" hidden>
      <div class="notice">5단계에서도 4단계 소유자 검사를 유지합니다. 목록·조회·수정·삭제는 본인 메모만 허용됩니다.</div>

      <section class="panel">
        <h2>메모 추가</h2>
        <form id="create-form">
          <label>제목<input id="new-title" maxlength="120" required></label>
          <label>내용<textarea id="new-body" maxlength="5000" required></textarea></label>
          <button type="submit">추가</button>
        </form>
        <p id="note-status" class="status" aria-live="polite"></p>
      </section>

      <h2>메모 목록</h2>
      <ul id="notes" aria-live="polite"><li>자료를 불러오는 중입니다.</li></ul>
    </section>
  </main>

  <script type="module">
    const signedOut = document.querySelector('#signed-out');
    const signedIn = document.querySelector('#signed-in');
    const vault = document.querySelector('#vault');
    const loginForm = document.querySelector('#login-form');
    const loginStatus = document.querySelector('#login-status');
    const sessionLabel = document.querySelector('#session-label');
    const logoutButton = document.querySelector('#logout');
    const createForm = document.querySelector('#create-form');
    const noteStatus = document.querySelector('#note-status');
    const notes = document.querySelector('#notes');
    let loggedIn = false;

    function renderSession(isLoggedIn) {
      loggedIn = isLoggedIn;
      signedOut.hidden = isLoggedIn;
      signedIn.hidden = !isLoggedIn;
      vault.hidden = !isLoggedIn;
      sessionLabel.textContent = isLoggedIn ? '로그인됨' : '로그인 필요';
      if (!isLoggedIn) notes.replaceChildren();
    }

    async function jsonRequest(path, options = {}) {
      const headers = new Headers(options.headers ?? {});
      if (options.body !== undefined) headers.set('Content-Type', 'application/json');
      const response = await fetch(path, {
        ...options,
        headers,
        credentials: 'same-origin',
        cache: 'no-store',
      });
      if (response.status === 204) return null;
      let body = null;
      try { body = await response.json(); } catch { /* JSON이 아니면 아래 상태 코드로 처리 */ }
      if (!response.ok) {
        throw new Error(body?.message ?? body?.error ?? `요청 실패 (HTTP ${response.status})`);
      }
      return body;
    }

    async function api(path, options = {}) {
      if (!loggedIn) throw new Error('로그인이 필요합니다.');
      return jsonRequest(path, options);
    }

    function noteItem(note) {
      const item = document.createElement('li');
      const title = document.createElement('strong');
      const body = document.createElement('span');
      const actions = document.createElement('div');
      const edit = document.createElement('button');
      const remove = document.createElement('button');
      actions.className = 'row';
      edit.className = 'secondary';
      remove.className = 'danger';
      edit.type = remove.type = 'button';
      edit.textContent = '수정';
      remove.textContent = '삭제';
      title.textContent = note.title;
      body.textContent = note.body;

      edit.addEventListener('click', async () => {
        const nextTitle = prompt('새 제목', note.title);
        if (nextTitle === null) return;
        const nextBody = prompt('새 내용', note.body);
        if (nextBody === null) return;
        try {
          await api(`/api/notes/${encodeURIComponent(note.id)}`, {
            method: 'PUT', body: JSON.stringify({ title: nextTitle, body: nextBody }),
          });
          noteStatus.textContent = '메모를 수정했습니다.';
          await loadNotes();
        } catch (error) { noteStatus.textContent = `수정 실패: ${error.message}`; }
      });

      remove.addEventListener('click', async () => {
        if (!confirm('이 메모를 삭제할까요?')) return;
        try {
          await api(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
          noteStatus.textContent = '메모를 삭제했습니다.';
          await loadNotes();
        } catch (error) { noteStatus.textContent = `삭제 실패: ${error.message}`; }
      });

      actions.append(edit, remove);
      item.append(title, body, actions);
      return item;
    }

    async function loadNotes() {
      try {
        const data = await api('/api/notes');
        if (!Array.isArray(data)) throw new Error('자료 형식이 맞지 않습니다.');
        notes.replaceChildren(...data.map(noteItem));
        if (!data.length) {
          notes.append(Object.assign(document.createElement('li'), { textContent: '메모가 없습니다.' }));
        }
      } catch (error) {
        notes.replaceChildren(Object.assign(document.createElement('li'), {
          textContent: `자료 조회 실패: ${error.message}`,
        }));
      }
    }

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      loginStatus.textContent = '로그인 중입니다.';
      const email = document.querySelector('#email').value;
      const password = document.querySelector('#password').value;
      try {
        await jsonRequest('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });
        loginForm.reset();
        loginStatus.textContent = '';
        renderSession(true);
        await loadNotes();
      } catch (error) {
        renderSession(false);
        loginStatus.textContent = `로그인 실패: ${error.message}`;
      }
    });

    logoutButton.addEventListener('click', async () => {
      try {
        await jsonRequest('/api/auth/logout', { method: 'POST' });
        renderSession(false);
        loginStatus.textContent = '로그아웃했습니다.';
      } catch (error) {
        noteStatus.textContent = `로그아웃 실패: ${error.message}`;
      }
    });

    createForm.addEventListener('submit', async event => {
      event.preventDefault();
      const title = document.querySelector('#new-title').value;
      const body = document.querySelector('#new-body').value;
      try {
        await api('/api/notes', { method: 'POST', body: JSON.stringify({ title, body }) });
        createForm.reset();
        noteStatus.textContent = '메모를 추가했습니다.';
        await loadNotes();
      } catch (error) { noteStatus.textContent = `추가 실패: ${error.message}`; }
    });

    try {
      await jsonRequest('/api/auth/session');
      renderSession(true);
      await loadNotes();
    } catch {
      renderSession(false);
    }
  </script>
</body>
</html>
